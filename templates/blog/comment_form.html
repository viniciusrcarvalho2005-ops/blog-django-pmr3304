{% extends 'base.html' %}
{% block content %}
  <p class="kicker">Novo comentário</p>
  <h2>{{ post.title }}</h2>
  <p class="meta">Basta informar seu nome; não é preciso ter conta.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p class="actions">
      <button type="submit">Publicar comentário</button>
      <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
    </p>
  </form>
{% endblock %}
