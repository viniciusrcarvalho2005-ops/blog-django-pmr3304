{% extends 'base.html' %}
{% block content %}
  <h2>{% if post %}Editar post{% else %}Novo post{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p class="actions">
      <button type="submit">Salvar</button>
      <a href="{% if post %}{% url 'post_detail' post.pk %}{% else %}{% url 'post_list' %}{% endif %}">Cancelar</a>
    </p>
  </form>
{% endblock %}
