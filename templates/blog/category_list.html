{% extends 'base.html' %}
{% block content %}
  <h2>Categorias</h2>
  <ul>
    {% for category in category_list %}
      <li>
        <a href="{% url 'category_detail' category.pk %}">{{ category.name }}</a>
        <span class="meta">– {{ category.posts.count }} post(s)</span>
      </li>
    {% empty %}
      <li>Nenhuma categoria cadastrada.</li>
    {% endfor %}
  </ul>
{% endblock %}
