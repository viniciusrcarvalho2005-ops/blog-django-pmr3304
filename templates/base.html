<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Caderno de Engenharia{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #DD1A22; --red-hover: #B9151C;
      --charcoal: #121417; --charcoal-2: #1C1F24;
      --ink: #14161A; --ink-soft: #3A3E45; --ink-mute: #6B7077;
      --paper: #FFFFFF; --paper-2: #F5F4F1; --line: #E4E3DF;
      --display: 'Fraunces', Georgia, serif;
      --body: 'Inter', system-ui, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper-2); color: var(--ink); font: 17px/1.6 var(--body); }
    a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 3px; }
    a:hover { color: var(--red); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }

    header { background: var(--charcoal); border-bottom: 3px solid var(--red); }
    header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font: 600 1.35rem var(--display); }
    .brand:hover { color: #fff; }
    .brand::before { content: ''; width: 12px; height: 26px; background: var(--red); }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
    nav a, nav .who, nav button { font: 600 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #fff; text-decoration: none; }
    nav .who { color: #CFD1D6; }
    nav a:hover { color: var(--red); }
    nav form { margin: 0; }
    nav button { background: none; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
    nav button:hover { border-color: var(--red); color: var(--red); }

    main { background: var(--paper); margin: 32px auto; padding: 28px 32px 36px; border: 1px solid var(--line); }
    h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -.015em; line-height: 1.15; }
    h2 { font-size: 2rem; margin: 0 0 16px; }
    h3 { font-size: 1.35rem; margin: 32px 0 12px; }
    .kicker { font: 600 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--red); margin: 0 0 8px; }
    .kicker::before { content: '— '; }
    .kicker a { color: var(--red); text-decoration: none; }
    .kicker a:hover { text-decoration: underline; }
    .meta { font: 500 .8rem var(--mono); color: var(--ink-mute); letter-spacing: .04em; }
    .lead { color: var(--ink-soft); }

    .post-list { list-style: none; padding: 0; margin: 0; }
    .post-list li { border-top: 1px solid var(--line); padding: 16px 0; }
    .post-list li:first-child { border-top: 0; }
    .post-list a { font: 600 1.3rem/1.25 var(--display); text-decoration: none; }
    .post-list .meta { display: block; margin-top: 4px; }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 24px; }
    .actions a { font: 600 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    button[type=submit], .btn { background: var(--red); color: #fff; border: 0; padding: 10px 18px; font: 600 .8rem var(--mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    button[type=submit]:hover { background: var(--red-hover); }
    nav button[type=submit] { background: none; padding: 4px 10px; }

    label { font: 600 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
    input[type=text], input[type=password], textarea { width: 100%; padding: 10px; margin-top: 6px; font: 1rem var(--body); border: 1px solid #C9C8C3; background: var(--paper); }
    input:focus, textarea:focus { outline: 2px solid var(--red); border-color: transparent; }
    textarea { min-height: 200px; }
    .helptext, .errorlist { font-size: .85rem; color: var(--ink-mute); }
    .errorlist { color: var(--red); }

    .comment { border-left: 3px solid var(--red); background: var(--paper-2); padding: 10px 14px; margin: 14px 0; }
    .comment p { margin: 4px 0; }

    footer { background: var(--charcoal); color: #CFD1D6; font: 500 .75rem var(--mono); letter-spacing: .06em; }
    footer .wrap { padding-top: 18px; padding-bottom: 18px; }

    @media (max-width: 600px) { main { padding: 20px 16px; margin: 16px 0; border-left: 0; border-right: 0; } h2 { font-size: 1.6rem; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="{% url 'post_list' %}">Caderno de Engenharia</a>
      <nav>
        <a href="{% url 'post_list' %}">Posts</a>
        <a href="{% url 'category_list' %}">Categorias</a>
        <a href="{% url 'post_create' %}">Novo post</a>
        {% if user.is_authenticated %}
          <span class="who">Olá, {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sair</button></form>
        {% else %}
          <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="wrap">PMR3304 – Sistemas de Informação – Segunda entrega de laboratório</div>
  </footer>
</body>
</html>
