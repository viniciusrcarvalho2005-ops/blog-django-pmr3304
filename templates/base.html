<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog de Engenharia{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 0 16px; color: #222; }
    header { border-bottom: 2px solid #1f4e79; padding: 16px 0; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.5em; }
    a { color: #1f4e79; }
    .meta { color: #666; font-size: .9em; }
    .actions a, .actions button { margin-right: 12px; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
    textarea { min-height: 200px; }
    .comment { border-left: 3px solid #ccc; padding-left: 10px; margin: 12px 0; }
    footer { border-top: 1px solid #ccc; margin-top: 40px; padding: 12px 0; color: #666; font-size: .85em; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'post_list' %}">Blog de Engenharia</a></h1>
    <nav>
      <a href="{% url 'post_list' %}">Posts</a>
      {% block nav_extra %}{% endblock %}
      <a href="{% url 'post_create' %}">Novo post</a>
      {% if user.is_authenticated %}
        <span class="meta">Olá, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit">Sair</button></form>
      {% else %}
        <a href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>PMR3304 – Sistemas de Informação – Segunda entrega de laboratório</footer>
</body>
</html>
